name: Build eBayFixer rootful

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebayfixer-rootful-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Settings icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prefs/Resources
          raw="$RUNNER_TEMP/ebay-artwork"
          python3 - "$raw" <<'PY'
          import json, pathlib, sys, urllib.request
          destination = pathlib.Path(sys.argv[1])
          req = urllib.request.Request("https://itunes.apple.com/lookup?id=282614216&country=gb", headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.load(r)
          result = payload["results"][0]
          artwork = result.get("artworkUrl512") or result.get("artworkUrl100") or result.get("artworkUrl60")
          with urllib.request.urlopen(urllib.request.Request(artwork, headers={"User-Agent":"Mozilla/5.0"}), timeout=30) as r:
              destination.write_bytes(r.read())
          PY
          /usr/bin/sips -s format png -z 29 29 "$raw" --out prefs/Resources/icon.png >/dev/null
          /usr/bin/sips -s format png -z 58 58 "$raw" --out prefs/Resources/icon@2x.png >/dev/null
          /usr/bin/sips -s format png -z 87 87 "$raw" --out prefs/Resources/icon@3x.png >/dev/null

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootful package
        id: compile
        shell: bash
        run: |
          chmod 755 layout/DEBIAN/postinst
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eBayFixer-build-log
          path: build.log
          if-no-files-found: warn

      - name: Stop on compiler failure
        if: steps.compile.outputs.status != '0'
        run: exit 1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.ebayfixer"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.67"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/ebayfixer-check"
          root="$RUNNER_TEMP/ebayfixer-check"
          dylib="$root/Library/MobileSubstrate/DynamicLibraries/eBayFixer.dylib"
          filter="$root/Library/MobileSubstrate/DynamicLibraries/eBayFixer.plist"
          bundle="$root/Library/PreferenceBundles/eBayFixerPrefs.bundle"
          entry="$root/Library/PreferenceLoader/Preferences/eBayFixer.plist"
          test -s "$dylib"
          test -s "$filter"
          test -s "$bundle/eBayFixerPrefs"
          test -s "$bundle/Info.plist"
          test -s "$bundle/Root.plist"
          test -s "$bundle/icon.png"
          test -s "$bundle/icon@2x.png"
          test -s "$bundle/icon@3x.png"
          test -s "$entry"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          xcrun lipo "$bundle/eBayFixerPrefs" -verify_arch arm64 arm64e
          if strings "$dylib" | grep -q "eBayFixerDiag"; then
            echo "Diagnostic logger unexpectedly present in packaged dylib"
            exit 1
          fi
          plutil -lint "$filter"
          plutil -lint "$bundle/Info.plist"
          plutil -lint "$bundle/Root.plist"
          plutil -lint "$entry"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrincipalClass' "$bundle/Info.plist")" = "EBRootListController"
          test "$(/usr/libexec/PlistBuddy -c 'Print :entry:icon' "$entry")" = "icon.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :items:1:defaults' "$bundle/Root.plist")" = "com.551.ebayfixer"

      - uses: actions/upload-artifact@v4
        with:
          name: eBayFixer-rootful
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          notes='Keeps every existing compatibility fix. Reworks only the direct Add to basket fallback using the legacy cart ABI found in eBay 6.192: the native selector takes ModuleLinker.CartListingProtocol, and ItemProduct provides AddToCartListing with listingID, transactionID, selectedVariationID and quantityRequested. The tweak now builds that exact wrapper from the live View Item model, uses a retained normal ExpSvcShoppingCartDataManager instance because the legacy binary has no exported .shared getter, and performs the instance-method lookup on the real class instead of its metaclass. No diagnostic logging is included.'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" --clobber
            gh release edit "$tag" --title "eBayFixer ${version}" --notes "$notes"
          else
            gh release create "$tag" "$deb" --target "$GITHUB_SHA" --title "eBayFixer ${version}" --notes "$notes"
          fi

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ -n "$old" ] && [ "$old" != "$tag" ]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done
