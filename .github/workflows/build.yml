name: Build eBayFixer rootful

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebayfixer-rootful-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Settings icon
        run: |
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path('prefs/eBayIcon.b64').read_text().strip()
          out = pathlib.Path('layout/Library/PreferenceLoader/Preferences/eBayFixer.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(src))
          PY

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootful package
        id: compile
        shell: bash
        run: |
          chmod 755 layout/DEBIAN/postinst
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eBayFixer-build-log
          path: build.log
          if-no-files-found: warn

      - name: Stop on compiler failure
        if: steps.compile.outputs.status != '0'
        run: exit 1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb -f "${debs[0]}" Package | grep -qx 'com.551.ebayfixer'
          dpkg-deb -f "${debs[0]}" Architecture | grep -qx 'iphoneos-arm'
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/ebayfixer-check"
          root="$RUNNER_TEMP/ebayfixer-check"
          test -s "$root/Library/MobileSubstrate/DynamicLibraries/eBayFixer.dylib"
          test -s "$root/Library/MobileSubstrate/DynamicLibraries/eBayFixer.plist"
          test -s "$root/Library/PreferenceBundles/eBayFixerPrefs.bundle/eBayFixerPrefs"
          test -s "$root/Library/PreferenceLoader/Preferences/eBayFixer.plist"
          test -s "$root/Library/PreferenceLoader/Preferences/eBayFixer.png"
          xcrun lipo "$root/Library/MobileSubstrate/DynamicLibraries/eBayFixer.dylib" -verify_arch arm64 arm64e

      - uses: actions/upload-artifact@v4
        with:
          name: eBayFixer-rootful
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          notes='eBay 6.96.0 compatibility for rootful iOS 14. Restores Home, updates the old listing-detail request path/parameters, bypasses the expired-version checks, and adds an Enabled switch in Settings.'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" --clobber
            gh release edit "$tag" --title "eBayFixer ${version}" --notes "$notes"
          else
            gh release create "$tag" "$deb" --target "$GITHUB_SHA" --title "eBayFixer ${version}" --notes "$notes"
          fi

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
            if [ -n "$old" ] && [ "$old" != "$tag" ]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done
